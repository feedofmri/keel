[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keel"
version = "0.1.0"
description = "A code-repair agent that knows when it should not be trusted: Meta Muse models propose patches, conformal risk control decides which are safe to auto-merge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "httpx>=0.25",
  "pyflakes>=3.0",
  "pytest>=7.4",
  "pytest-timeout>=2.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[project.scripts]
keel = "keel.cli:main"

[tool.setuptools.packages.find]
include = ["keel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "B905"]
