# Temporary: send keel.boraqs.com the same kind of request a Keel run report makes, from GitHub's network.
name: Probe platform
on:
  push:
    branches: [claude/eager-heisenberg-l6xf68]
    paths: [.github/workflows/probe-platform.yml]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: GET /healthz
        run: |
          curl -sS -w ' [%{http_code}]\n' https://keel.boraqs.com/healthz || true
      - name: POST /api/runs with a fake token (curl)
        run: |
          curl -sS -w ' [%{http_code}]\n' -X POST https://keel.boraqs.com/api/runs -H 'Authorization: Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6ImFiYyJ9.e30.c2ln' -H 'content-type: application/json' -d '{}' || true
      - name: POST /api/runs with a real OIDC token (httpx, as Keel does)
        run: |
          pip install -q httpx
          python - <<'PY'
          import os, httpx, time
          t = httpx.get(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=keel.boraqs.com",
                        headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]}).json()["value"]
          body = {"trigger": "probe", "commit_sha": "0" * 40, "n_candidates": 0, "selected_score": None, "threshold": None,
                  "decision": "NEEDS REVIEW", "pr_number": None, "cost_usd": 0}
          for label, auth in [("fake token", "Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6ImFiYyJ9.e30.c2ln"), ("real token", "Bearer " + t)]:
              try:
                  r = httpx.post("https://keel.boraqs.com/api/runs", json=body, headers={"Authorization": auth}, timeout=30)
                  print(label, r.status_code, r.headers.get("server"), r.text[:300])
              except Exception as e:
                  print(label, "FAILED:", type(e).__name__, e)
              time.sleep(2)
          try:
              print("healthz after:", httpx.get("https://keel.boraqs.com/healthz", timeout=30).text)
          except Exception as e:
              print("healthz after FAILED:", e)
          PY
