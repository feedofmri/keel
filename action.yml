name: "Keel – trustworthy auto-repair"
description: "Repairs failing tests with Meta Muse models and labels each fix AUTO-MERGE or NEEDS REVIEW using conformal risk control."
author: "feedofmri"
branding:
  icon: "anchor"
  color: "gray-dark"

inputs:
  github-token:
    description: "Token used to push the fix branch and open the pull request."
    default: ${{ github.token }}
  models:
    description: "Comma-separated generators: muse-spark, muse-spark-open, muse-glimmer."
    default: "muse-spark,muse-spark-open"
  attacker:
    description: "Model that writes adversarial tests ('none' to disable)."
    default: "muse-spark"
  alpha:
    description: "Risk level α (e.g. 0.1)."
    default: ""
  method:
    description: "crc or ltt."
    default: ""
  k:
    description: "Samples per model."
    default: ""
  calibration:
    description: "Path (in the repo) to a Keel calibration JSON. Without one Keel never auto-merges."
    default: ""
  python-version:
    description: "Set up this Python first. Leave empty (default) to use the Python your workflow already set up, so Keel runs your tests with your installed dependencies."
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      if: inputs.python-version != ''
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Keel
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Run Keel
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        KEEL_INPUT_MODELS: ${{ inputs.models }}
        KEEL_INPUT_ATTACKER: ${{ inputs.attacker }}
        KEEL_INPUT_ALPHA: ${{ inputs.alpha }}
        KEEL_INPUT_METHOD: ${{ inputs.method }}
        KEEL_INPUT_K: ${{ inputs.k }}
        KEEL_INPUT_CALIBRATION: ${{ inputs.calibration }}
      run: keel action
