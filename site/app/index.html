<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keel App</title>
<meta name="description" content="Sign in with GitHub, connect a repository and let Keel repair failing tests with a guarantee.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="app.css">
<script src="../assets/site.js"></script>
<script src="app.js"></script>
</head>
<body class="booting">
<div id="demo"></div>
<header class="top app-top"><div class="wrap">
  <a class="brand" href="./" data-app><svg viewBox="590 568 752 792" fill="currentColor" aria-hidden="true"><path d="M678 588H906V925C762 896 678 790 678 640Z"/><path d="M1090 588H1322C1258 838 1080 990 855 1010C990 880 1060 740 1090 588Z"/><path d="M906 1026V1340H610C622 1160 742 1030 906 1026Z"/><path d="M928 1026C1160 1018 1300 1170 1322 1340H1092C1072 1200 1018 1100 928 1026Z"/></svg>Keel</a>
  <nav class="nav"><a href="./" data-app aria-current="page">Repositories</a><button class="theme-btn" id="theme" aria-label="Toggle colour theme"></button></nav>
  <div class="who" id="who"></div>
</div></header>

<main class="app"><div class="wrap" id="view"></div></main>

<script>
(async () => {
  const { api, esc, statusPill, guard, href } = KeelApp;
  const me = await guard(); if (!me) return;
  const view = document.getElementById("view");
  view.innerHTML = `<div class="page-head" style="margin-top:0"><div><div class="crumbs">${esc(me.user.login)}</div><h1 style="margin-top:8px">Repositories</h1></div>
      <div class="actions"><a class="btn" href="${esc(me.installUrl)}" target="_blank" rel="noopener">Add repositories on GitHub</a></div></div>
    <div id="list"><p class="muted">Loading repositories…</p></div>`;
  try {
    const { repos } = await api("/api/repos");
    const list = document.getElementById("list");
    if (!repos.length) {
      list.innerHTML = `<div class="empty"><h3 class="h-panel">Install the Keel GitHub App to get started</h3>
        <p class="p-small" style="margin-top:8px">Choose the repositories Keel may work on. You can change this any time on GitHub.</p>
        <div class="ctas" style="justify-content:flex-start"><a class="btn primary" href="${esc(me.installUrl)}">Install Keel on GitHub</a></div></div>`;
      return;
    }
    list.innerHTML = `<div class="repo-list">` + repos.map(r => {
      const isNew = r.status === "new";
      const link = isNew ? href("setup.html", r.full_name) : href("repo.html", r.full_name);
      return `<div class="repo-row"><div class="name">${esc(r.full_name)}<small>${r.private ? "Private" : "Public"}${r.language ? " · " + esc(r.language) : ""}</small></div>
        <div class="hide-sm">${statusPill(r.status)}</div><div class="hide-sm muted" style="font-size:13px">${isNew ? "" : "α " + Math.round(r.alpha * 100) + "%"}</div>
        <a class="btn ${isNew && r.canManage ? "primary" : ""}" href="${link}">${isNew ? (r.canManage ? "Set up" : "View") : "Open"} <span class="arrow">→</span></a></div>`;
    }).join("") + `</div>`;
  } catch (e) { document.getElementById("list").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
})();
</script>
</body>
</html>
