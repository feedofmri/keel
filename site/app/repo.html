<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keel Repository</title>
<meta name="description" content="Runs, decisions, risk budget and cost for one repository.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="app.css">
<script src="../assets/site.js"></script>
<script src="app.js"></script>
</head>
<body>
<div id="demo"></div>
<header class="top app-top"><div class="wrap">
  <a class="brand" href="../"><svg viewBox="590 568 752 792" fill="currentColor" aria-hidden="true"><path d="M678 588H906V925C762 896 678 790 678 640Z"/><path d="M1090 588H1322C1258 838 1080 990 855 1010C990 880 1060 740 1090 588Z"/><path d="M906 1026V1340H610C622 1160 742 1030 906 1026Z"/><path d="M928 1026C1160 1018 1300 1170 1322 1340H1092C1072 1200 1018 1100 928 1026Z"/></svg>Keel</a>
  <nav class="nav"><a href="./" id="back">Repositories</a><button class="theme-btn" id="theme" aria-label="Toggle colour theme"></button></nav>
  <div class="who" id="who"></div>
</div></header>

<main class="app"><div class="wrap" id="view"><p class="muted">Loading…</p></div></main>

<script>
(async () => {
  const { api, esc, ago, statusPill, shell, DEMO, params } = KeelApp;
  const full = params.get("repo") || "", q = DEMO ? "&demo" : "";
  if (DEMO) document.getElementById("back").href = "./?demo";
  const me = await api("/api/me"); shell(me);
  if (!me.user) { location.href = DEMO ? "./?demo" : "./"; return; }
  const base = `/api/repos/${full.split("/").map(encodeURIComponent).join("/")}`;
  const view = document.getElementById("view");
  let timer = null, flash = "";

  async function load() {
    let d;
    try { d = await api(base); } catch (e) { view.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
    const r = d.repo, s = d.stats;
    const budget = s.autoMerged ? s.wrong / s.autoMerged : 0;
    const paused = r.status === "paused";
    view.innerHTML = `
      <div class="crumbs"><a href="./${DEMO ? "?demo" : ""}">Repositories</a> / ${esc(r.full_name)}</div>
      <div class="page-head"><div><h1>${esc(r.full_name)}</h1>
          <div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${statusPill(r.status)}
          <span class="muted" style="font-size:13px">α ${Math.round(r.alpha * 100)}% · ${r.method.toUpperCase()} · ${r.autoMerge ? "auto-merge" : "label only"} · ${esc(r.models.join(" + "))}</span>
          ${r.status === "active" ? '<span class="live">live</span>' : ""}</div></div>
        ${r.canManage ? `<div class="actions">
          <button class="btn primary" id="fix">Fix now</button>
          <button class="btn" id="toggle">${paused ? "Resume" : "Pause"}</button>
          <a class="btn" href="setup.html?repo=${encodeURIComponent(r.full_name)}${q}">Settings</a></div>` : ""}</div>
      ${flash ? `<div class="banner" style="margin-bottom:28px">${flash}</div>` : ""}
      ${r.status === "setup_pr_open" ? `<div class="banner" style="margin-bottom:28px">Waiting for setup PR #${r.setupPr} to be merged. Keel goes live as soon as it is.</div>` : ""}
      <div class="kpis">
        <div><div class="k">Runs</div><div class="v">${s.runs}</div><div class="s">last 50</div></div>
        <div><div class="k">Auto-merged</div><div class="v">${s.autoMerged}</div><div class="s">${s.runs ? Math.round(100 * s.autoMerged / s.runs) : 0}% of runs</div></div>
        <div><div class="k">Wrong merges</div><div class="v">${s.wrong}</div><div class="s">reverted or flagged</div></div>
        <div><div class="k">Model cost</div><div class="v">$${s.cost.toFixed(2)}</div><div class="s">all runs</div></div>
      </div>
      <div class="budget">
        <div><h3 class="h-panel">Risk budget</h3><p class="p-small" style="margin-top:6px">Observed wrong share of auto-merges against your α of ${Math.round(r.alpha * 100)}%.</p></div>
        <div><div class="gauge"><div class="fill" style="width:${Math.min(100, (budget / r.alpha) * 100)}%"></div></div>
          <div class="gauge-labels"><span>${Math.round(budget * 100)}% used</span><span>budget α = ${Math.round(r.alpha * 100)}%</span></div></div>
      </div>
      <div class="runs"><h2>Runs</h2>
        ${d.runs.length ? d.runs.map(x => `<div class="run">
          <div class="hide-sm muted" style="font-size:13px">${ago(x.finished_at)}</div>
          <div class="t">${esc((x.report.failing_tests || [])[0] || "repair run")}${(x.report.failing_tests || []).length > 1 ? ` +${x.report.failing_tests.length - 1}` : ""}
            <small>${esc(x.trigger.replace("_", " "))} · ${esc(String(x.commit_sha).slice(0, 7))} · ${x.n_candidates ?? "–"} candidates${x.merged_at ? " · merged" : ""}${x.reverted_at ? " · reverted" : ""}</small></div>
          <div class="score hide-sm">risk ${x.selected_score == null ? "–" : Number(x.selected_score).toFixed(3)} / λ̂ ${x.threshold == null ? "–" : Number(x.threshold).toFixed(3)}</div>
          <div>${x.pr_number ? `<a class="pill ${x.decision === "AUTO-MERGE" ? "auto" : "review"}" style="text-decoration:none" href="https://github.com/${esc(r.full_name)}/pull/${x.pr_number}" target="_blank" rel="noopener"><span class="dot"></span>${esc(x.decision)} #${x.pr_number}</a>` : `<span class="pill review"><span class="dot"></span>${esc(x.decision || "no fix")}</span>`}</div>
          ${(x.report.reasons || []).length ? `<details><summary>Why</summary><ul>${x.report.reasons.map(t => `<li>${esc(t)}</li>`).join("")}</ul></details>` : ""}
        </div>`).join("") : `<p class="empty">No runs yet. Keel runs when CI fails, on <code>/keel fix</code>, or when you press Fix now.</p>`}
      </div>`;
    const fix = document.getElementById("fix"), tog = document.getElementById("toggle");
    if (fix) fix.onclick = async () => { fix.disabled = true; fix.textContent = "Starting…";
      try { await api(`${base}/fix`, { method: "POST", body: "{}" }); flash = "Keel run started on GitHub Actions. It appears here when it finishes."; }
      catch (e) { flash = esc(e.message); } load(); };
    if (tog) tog.onclick = async () => { tog.disabled = true;
      try { await api(`${base}/${paused ? "resume" : "pause"}`, { method: "POST", body: "{}" }); if (DEMO) flash = paused ? "Resumed." : "Paused (demo)."; }
      catch (e) { flash = esc(e.message); } load(); };
  }
  await load();
  // Shared hosting can't hold WebSockets open, so poll while the tab is visible.
  timer = setInterval(() => { if (!document.hidden && !DEMO) load(); }, 10000);
})();
</script>
</body>
</html>
